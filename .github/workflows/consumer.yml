name: Weibo Consumer

on:
  schedule:
    - cron: '30 */6 * * *'  # 每6小时运行一次
  workflow_dispatch:         # 支持手动触发

concurrency:
  group: weibo-consumer
  cancel-in-progress: false

jobs:
  media-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 255 # 安装依赖 + 4 小时消费预算 + 清理兜底
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GIST_ID: ${{ secrets.GIST_ID }}
      GIST_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      GIST_STORAGE_STATE_FILENAME: weibo.storage.json
      STORAGE_STATE_PATH: weibo.storage.json
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium

      - name: Install Playwright System Dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Fetch storageState from Gist
        run: pnpm run storage:fetch

      - name: Run Consumer
        run: pnpm run consume
